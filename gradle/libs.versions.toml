[versions]
agp = "9.4.0"
kotlin = "2.4.20"

ktor = "3.6.0"
coroutines = "1.11.0"
serialization = "1.11.0"

[libraries]
# --- Ktor (HTTP transport) ---
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }

# --- Coroutines / Serialization ---
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

[plugins]
# Note: do NOT declare org.jetbrains.kotlin.jvm here. Applying
# kotlin.multiplatform in the root project already puts the Kotlin Gradle Plugin
# on the build classpath, and requesting a versioned alias for a sibling plugin
# from that same plugin fails with "already on the classpath with an unknown
# version". The examples project applies it by bare id instead.
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
