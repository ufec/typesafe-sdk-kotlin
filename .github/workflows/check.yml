name: Check

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Runs first because it needs nothing but the checkout, and a malformed
      # changelog entry is cheapest to find before anything is built. The same
      # script reads the changelog on release day to fill in the GitHub release
      # notes, so this also proves the release will not fail there.
      - name: Check the changelog
        run: python3 .github/scripts/release_notes.py --check

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Pinned to v4: v3 runs on Node20, which GitHub is retiring. v4 also
      # bundles cmdline-tools 20.0, which is what knows about the newer
      # platforms.
      - uses: android-actions/setup-android@v4

      # The build needs a matching Android platform installed. AGP 9 names these
      # with a minor version, so the package for `compileSdk = 37` is
      # `platforms;android-37.0` -- there is no plain `platforms;android-37`, and
      # asking for one fails the step before Gradle ever runs. Echo the SDK
      # location and the installed list so a failure here names its own cause.
      - name: Install the Android platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          sdkmanager --install 'platforms;android-37.0'
          sdkmanager --list_installed | grep -F 'platforms;android-37.0'

      # `build` covers every project, so this also compiles :examples and runs
      # ktlintCheck. Compiling the example matters for the same reason the
      # upstream SDK lists `examples` in its tsconfig include list: an example
      # that is not compiled rots. Style is configured in .editorconfig, which is
      # ktlint's own configuration file.
      - name: Build, lint, and run the test suite
        run: ./gradlew build --stacktrace --console=plain

      - name: Verify the artifacts can be published
        run: ./gradlew publishToMavenLocal --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
          if-no-files-found: ignore
