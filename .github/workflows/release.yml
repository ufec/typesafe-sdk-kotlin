name: Release

# Tags are how releases happen here: JitPack builds whatever tag is asked for.
# This workflow adds the part JitPack does not provide, a GitHub release whose
# notes come from the changelog, and acts as the gate that proves the changelog
# actually describes the tag being published.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4

      - name: Install the Android platform
        run: |
          sdkmanager --install 'platforms;android-37.0'
          sdkmanager --list_installed | grep -F 'platforms;android-37.0'

      # Build the exact commit being released rather than trusting that CI saw it.
      - name: Build, lint, and test the tagged commit
        run: ./gradlew build --stacktrace --console=plain

      # Fails if the tag disagrees with the version in build.gradle.kts, if there
      # is no changelog entry for it, or if that entry is not the newest one.
      # JitPack artifacts cannot be recalled, so this is the last chance to catch
      # a mislabelled release.
      - name: Validate the tag against the changelog
        id: notes
        run: |
          title="$(python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME")"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" --notes-file release-notes.md
          fi
